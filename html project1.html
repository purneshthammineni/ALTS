<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family: Georgia, serif;
            background:#f2f2f2;

            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:500px;
            text-align:center;
        }

        h1{
            font-size:48px;
            margin-bottom:30px;
            color:#222;
        }

        label{
            display:block;
            font-size:24px;
            margin-top:15px;
            margin-bottom:10px;
            color:#555;
        }

        input{
            width:100%;
            padding:15px;
            font-size:28px;
            border:2px solid #d3d3d3;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            margin-top:35px;
            padding:12px 35px;
            font-size:28px;
            color:white;
            background:#0d6efd;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#0056d2;
        }

        #result{
            margin-top:35px;
            font-size:34px;
            font-weight:bold;
            color:#222;
        }

        #status{
            margin-top:20px;
            font-size:32px;
            font-weight:bold;
            color:#333;
        }

    </style>
</head>
<body>

    <div class="container">

        <h1>BMI Calculator</h1>

        <label>Weight (kg):</label>
        <input type="number" id="weight" value="48">

        <label>Height (cm):</label>
        <input type="number" id="height" value="160">

        <button onclick="calculateBMI()">Calculate</button>

        <div id="result">Your BMI: 18.75</div>

        <div id="status">Status: Normal weight</div>

    </div>

    <script>

        function calculateBMI(){

            let weight = document.getElementById("weight").value;
            let height = document.getElementById("height").value / 100;

            let bmi = weight / (height * height);

            document.getElementById("result").innerHTML =
                "Your BMI: " + bmi.toFixed(2);

            let status = "";

            if(bmi < 18.5){
                status = "Underweight";
            }
            else if(bmi >= 18.5 && bmi < 25){
                status = "Normal weight";
            }
            else if(bmi >= 25 && bmi < 30){
                status = "Overweight";
            }
            else{
                status = "Obese";
            }

            document.getElementById("status").innerHTML =
                "Status: " + status;
        }

    </script>

</body>
</html>
